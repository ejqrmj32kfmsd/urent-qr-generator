name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          # modules НЕ указываем (qtbase базовый, PrintSupport в нём)
          # cache убираем: кэш aqt на windows-раннерах — частый источник тихих падений
          cache: false

      - name: Locate toolchain (Qt root + MSVC vcvars)
        id: env
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtBin  = (Get-Command qmake).Source
          $qtRoot = Split-Path (Split-Path $qtBin)
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "QT_ROOT=$qtRoot"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }
          $vsPath = & $vswhere -latest -products * `
                      -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                      -property installationPath
          if (-not $vsPath) { throw "No VS with C++ tools" }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VCVARS=$vcvars"

      - name: Configure + Build (MSVC + Ninja, output to dist/)
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "DIST=%GITHUB_WORKSPACE%\dist"
          cmake -S . -B build -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_PREFIX_PATH="%QT_ROOT%" ^
                -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="%DIST%"
          if errorlevel 1 exit /b 1
          cmake --build build
          if errorlevel 1 exit /b 1

      - name: Deploy Qt runtime next to exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          windeployqt --release --no-translations --no-compiler-runtime (Join-Path $dist 'UrentQRGenerator.exe')

      - name: List dist (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath UrentQRGenerator_Windows.zip -Force

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: UrentQRGenerator_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual test)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: UrentQRGenerator_Windows
          path: UrentQRGenerator_Windows.zip
