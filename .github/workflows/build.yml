name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:   # ручной прогон без создания релиза

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Init MSVC environment (cl/link в PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          # modules НЕ указываем — qtbase базовый, PrintSupport входит в него.
          cache: true

      - name: Ensure Ninja
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version

      - name: Configure CMake (Ninja, чистый output в dist/)
        run: |
          $qtBin  = (Get-Command qmake).Source
          $qtRoot = Split-Path (Split-Path $qtBin)
          Write-Host "Qt root: $qtRoot"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          cmake -S . -B build -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_PREFIX_PATH="$qtRoot" `
                -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$dist"

      - name: Build
        run: cmake --build build

      - name: Deploy Qt runtime рядом с exe (в dist/)
        run: windeployqt --release --no-translations --no-compiler-runtime dist/UrentQRGenerator.exe

      - name: List dist (debug)
        run: Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - name: Create ZIP archive
        run: Compress-Archive -Path dist/* -DestinationPath UrentQRGenerator_Windows.zip -Force

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: UrentQRGenerator_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (ручной тест)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: UrentQRGenerator_Windows
          path: UrentQRGenerator_Windows.zip
