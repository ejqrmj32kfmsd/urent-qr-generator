name: Deploy Urent web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check website files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html || { echo 'ERROR: docs/index.html is missing. Put index.html directly inside docs/.'; exit 1; }
          test -f docs/styles.css || { echo 'ERROR: docs/styles.css is missing.'; exit 1; }
          test -f docs/app.js || { echo 'ERROR: docs/app.js is missing.'; exit 1; }
          echo 'Website source files found:'
          ls -lah docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
